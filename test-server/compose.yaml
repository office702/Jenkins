name: audio-translation-test

x-app: &app
  image: "${TEST_IMAGE:?missing test image}"
  platform: linux/amd64
  restart: unless-stopped
  init: true
  working_dir: /workspace/server/backend
  networks: [test-data]
  security_opt: [no-new-privileges:true]
  logging:
    driver: local
    options: {max-size: "10m", max-file: "3"}

services:
  backend:
    <<: *app
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_ENV_FILE: /dev/null
      DATA_DIR: /workspace/server/backend/data
      TRANSCRIPTION_PROVIDER: mock
      BRIDGE_STREAMING_ASR: "false"
      HEADSET_STREAMING_ASR: "false"
      POST_CALL_GOLD_ENABLED: "false"
    volumes:
      - backend-data:/workspace/server/backend/data
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; h=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4)); assert h['status']=='ok' and h['provider']=='mock'"]
      interval: 5s
      timeout: 5s
      start_period: 45s
      retries: 5

  client-logs:
    <<: *app
    command: ["python", "-m", "uvicorn", "app.client_log_app:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      CLIENT_LOG_SNAPSHOT_DIR: /test-client-logs
    volumes:
      - client-logs:/test-client-logs
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; h=json.load(urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=4)); assert h['service']=='client-logs' and h['status']=='ok'"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 5

  web:
    image: nginx@sha256:8eb2b5540eae779603cc3db84b3986a15ecb5308b54303146eee9837c137b51a
    platform: linux/arm64
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
      client-logs: {condition: service_healthy}
    networks: [ingress, test-data]
    ports:
      - "192.168.11.147:18100:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: "${TEST_FRONTEND_DIR:?missing test frontend}"
        target: /usr/share/nginx/html
        read_only: true
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/_test/version.json"]
      interval: 5s
      timeout: 4s
      retries: 5

networks:
  ingress:
  test-data:
    internal: true

volumes:
  backend-data:
  client-logs:
