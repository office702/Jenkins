map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header X-AudioTranslation-Environment test always;
    client_max_body_size 32m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 180s;
    proxy_buffering off;

    location = /api/bridge/client-log-snapshot {
        proxy_pass http://client-logs:8001;
    }
    location = /_test/client-logs-health {
        proxy_pass http://client-logs:8001/health;
    }
    location /api/ {
        proxy_pass http://backend:8000;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location = /_test/version.json {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
